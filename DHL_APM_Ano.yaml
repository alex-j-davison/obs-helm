agent:
  
  discovery:
    enabled: true
  
  config:

    processors:
      #############################
      # Annotation for APM toggle #
      #############################
      # 19.11. (Alex D) - Annotation to determine if java should be enabled or not
      k8sattributes/logs:
        extract:
          annotations:
            - from: namespace
              key: apm/o11yjavaapm
              tag_name: com.splunk.signalfx.logstoken
              
    receivers:
      kubeletstats:
        #This may need changing, depending on if a secure connection is set. DHL to clarify.
        insecure_skip_verify: true

