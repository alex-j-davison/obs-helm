agent:
  
  discovery:
    enabled: true
  
  config:

    exporters:
      
      # 19.11. (Alex D) - O11y endpoint defined
      otlphttp:
        traces_endpoint: https://ingest.us1.signalfx.com/v2/trace/otlp
        metrics_endpoint: "https://ingest.us1.signalfx.com/v2/datapoint/otlp"
        headers:
          X-SF-Token: djrozJD_OOKX6RVm9cFz2w

      signalfx:
        access_token: djrozJD_OOKX6RVm9cFz2w
        realm: us1

      # 19.11. (Alex D) - 
      splunk_hec/logs:
        # Splunk HTTP Event Collector token.
        token: 407c0dc9-8883-4c87-9e4b-69e7d5b0e399
        # URL to a Splunk instance to send data to.
        endpoint: "https://http-inputs.splunkods.splunkcloud.com:443/services/collector/event"
        # Whether to deactivate gzip compression over HTTP. Defaults to false.
        disable_compression: false
        # HTTP timeout when sending data. Defaults to 10s.
        timeout: 10s
        # Whether to skip checking the certificate of the HEC endpoint when sending data over HTTPS. Defaults to false.
        tls:
          insecure_skip_verify: true

    processors:
      batch:

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: :1888
      zpages:
        endpoint: :55679
        expvar:
          enabled: true
      file_storage:
        directory: /checkpoint/
        create_directory: true
    
    service:
      extensions: [pprof, zpages, health_check, file_storage]
      pipelines:
        metrics:
          exporters: [signalfx]
        traces:
          exporters: [otlphttp]
        logs:
          exporters: [splunk_hec/logs]

    receivers:
      kubeletstats:
        auth_type: serviceAccount
        insecure_skip_verify: true

