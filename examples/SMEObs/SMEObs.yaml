##############################################################################################################
## Helm Chart: Subject Matter Experiments Observability 1 Helm Chart                                        ##
## Description: To configure Otel Collector for sending data to a Splunk Observability and Splunk Platform. ##
##              Infrastructure Metrics, Application Metrics for Kubernetes cluster, and kubeinvaders.       ##
## Created date: 23/01/26                                                                                   ##  
## Arthur: Alex J Davison (alexdav@cisco.com)                                                               ##
## Version: 1.0.0                                                                                           ##  
##############################################################################################################

#############################################
## Cluster name and environment definition ##
#############################################

clusterName: ajdSMEObsCluster
environment: ajdSMEObsClusterEnv

###################################
## Gateway and Operator settings ##
###################################

gateway:
  enabled: false
operator:
  enabled: true
operatorcrds:
  install: true

#################################  
## Agent configuration section ##
#################################
 
agent:
  enabled: true
  discovery:
    enabled: true
  config:

#############################
## Receivers configuration ##
#############################

    receivers:
      kubeletstats:
        insecure_skip_verify: true
      prometheus/customport:
        port: 9091


#############################
## Processors configuration ##
#############################

    processors:
      clusterReceiver:
        enabled: true
      logsCollection:
        containers:
          enabled: true
      featureGates:
        useLightPrometheusReceiver: true

############################
## Pipeline configuration ##
############################

    pipeline:
      metrics:
        metrics/newprometheus:
          receivers:
          - otlp
          - signalx
          - prometheus/customport

#####################################################
## Splunk Observability and Platform configuration ##
#####################################################

splunkObservability:
  accessToken: KsSHTHDvadWBbdZ9pA0O-Q
  profilingEnabled: true
  realm: us1
  metricsEnabled: true
  tracesEnabled: true
  logsEnabled: false

splunkPlatform:
  endpoint: https://http-inputs.splunkods.splunkcloud.com:443/services/collector/event
  token: a319f672-1b42-4201-a443-54b35ae6f1d8
  index: "ajddefault"
  source: "kubernetes"
  metricsEnabled: false
  tracesEnabled: false
  logsEnabled: true
  insecureSkipVerify: true

autodetect:
 prometheus: true